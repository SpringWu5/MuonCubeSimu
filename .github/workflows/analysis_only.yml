name: Analysis-Only Workflow

on:
  issue_comment:
    types: [created]

jobs:
  trigger_analysis:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@bot /run-analysis')
    runs-on: ubuntu-latest
    steps:
      - name: Extract Script and Input Data from Comment
        id: get_params
        run: |
          # Extract the python script path (assuming it's the first argument)
          SCRIPT_PATH=$(echo "${{ github.event.comment.body }}" | awk '{print $3}')
          echo "script_path=${SCRIPT_PATH}" >> $GITHUB_OUTPUT
          
          # Extract the input data path (assuming it's the fourth argument)
          INPUT_DATA=$(echo "${{ github.event.comment.body }}" | awk '{print $4}')
          echo "input_data=${INPUT_DATA}" >> $GITHUB_OUTPUT

      - name: Post Acknowledgement Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const script = "${{ steps.get_params.outputs.script_path }}";
            const data = "${{ steps.get_params.outputs.input_data }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Received command to run analysis script \`${script}\` on data \`${data}\`. Connecting to INPAC cluster...`,
            });

      - name: Deploy and Run Analysis on INPAC
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.INPAC_HOST }}
          username: ${{ secrets.INPAC_USERNAME }}
          key: ${{ secrets.INPAC_SSH_PRIVATE_KEY }}
          port: ${{ secrets.INPAC_PORT }}
          script: |
            set -e
            export REPO_DIR="/lustre/neutrino/wujiacheng/hephaestus-ci/MuonSLab/MuonCubeSimu/${{ github.event.issue.number }}_analysis"
            export PR_SHA=${{ github.event.issue.pull_request.head.sha }}
            
            echo "--- Deploying code to ${REPO_DIR} ---"
            if [ -d "$REPO_DIR" ]; then
              cd $REPO_DIR
              git fetch origin
              git reset --hard $PR_SHA
            else
              git clone https://github.com/${{ github.repository }}.git $REPO_DIR
              cd $REPO_DIR
              git checkout $PR_SHA
            fi
            
            echo "--- Sourcing LCG Environment ---"
            source /cvmfs/sft.cern.ch/lcg/views/LCG_98python3/x86_64-centos7-gcc9-opt/setup.sh
            
            echo "--- Running Analysis Script ---"
            export SCRIPT_PATH="${{ steps.get_params.outputs.script_path }}"
            export INPUT_DATA="${{ steps.get_params.outputs.input_data }}"
            
            # The python script is expected to handle its own output and any callbacks
            python ${REPO_DIR}/${SCRIPT_PATH} --input ${INPUT_DATA} --pr-number "${{ github.event.issue.number }}" --repo-owner "${{ github.repository_owner }}" --repo-name "$(echo '${{ github.repository }}' | cut -d'/' -f2)" --token "${{ secrets.GITHUB_TOKEN }}"
