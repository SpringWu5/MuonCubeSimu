name: Physics Simulation CI/CD

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]

jobs:
  trigger_simulation:
    # 仅在 PR 上的评论才触发（不是普通 Issue）
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Debug event
        run: |
          echo "Actor:               ${{ github.actor }}"
          echo "Repo:                ${{ github.repository }}"
          echo "PR #:                ${{ github.event.issue.number }}"
          printf "Comment body:\n%s\n" "${{ github.event.comment.body }}"

      - name: Extract Simulation Size
        id: get_size
        run: |
          BODY=$(echo "${{ github.event.comment.body }}" | tr -d '\r')
          if [[ "$BODY" == *"/run-simulation small"* ]]; then
            echo "size=small" >> $GITHUB_OUTPUT
          elif [[ "$BODY" == *"/run-simulation large"* ]]; then
            echo "size=large" >> $GITHUB_OUTPUT
          else
            echo "size=" >> $GITHUB_OUTPUT
          fi
          echo "Detected size (in this step): $(sed -n 's/^size=//p' "$GITHUB_OUTPUT")"

      - name: Comment when command not recognized
        if: ${{ steps.get_size.outputs.size == '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "⚠️ Command not recognized. Use:\n\n`@bot /run-simulation small` or `@bot /run-simulation large`"
            });

      - name: Stop if no size parsed
        if: ${{ steps.get_size.outputs.size == '' }}
        run: |
          echo "No valid /run-simulation command found. Stopping."
          exit 0

      - name: Post Acknowledgement Comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const size = "${{ steps.get_size.outputs.size }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Received command to run **${size}** simulation. Connecting to INPAC cluster and deploying code...`,
            });

      - name: Validate INPAC secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          check() { if [ -z "$1" ]; then echo "Missing secret: $2"; missing=1; fi; }
          check "${{ secrets.INPAC_HOST }}" "INPAC_HOST"
          check "${{ secrets.INPAC_USERNAME }}" "INPAC_USERNAME"
          check "${{ secrets.INPAC_SSH_PRIVATE_KEY }}" "INPAC_SSH_PRIVATE_KEY"
          check "${{ secrets.INPAC_PORT }}" "INPAC_PORT"
          if [ "$missing" -eq 1 ]; then
            echo "One or more required INPAC_* secrets are missing. Failing the job."
            exit 1
          fi
          echo "All INPAC secrets are present."
      - name: Get PR SHA
        id: get_sha
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const sha = pr.data.head.sha;
            console.log(`Found PR head SHA: ${sha}`);
            core.setOutput('sha', sha);

      - name: Deploy and Run Simulation on INPAC
        id: remote_run
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.INPAC_HOST }}
          username: ${{ secrets.INPAC_USERNAME }}
          key: ${{ secrets.INPAC_SSH_PRIVATE_KEY }}
          port: ${{ secrets.INPAC_PORT }}
          script: |
            set -euo pipefail # Ensure script fails on any error
            export PATH=$HOME/bin:$PATH # Add user's bin dir to PATH for gh

            # 1. Define a unique, ephemeral workspace directory
            export REPO_DIR="/lustre/neutrino/wujiacheng/hephaestus-ci/MuonCubeSimu/pr_${{ github.event.issue.number }}_${{ steps.get_sha.outputs.sha }}"
            export PR_SHA="${{ steps.get_sha.outputs.sha }}"
            export SIM_SIZE="${{ steps.get_size.outputs.size }}"

            # 2. Define a cleanup function and set a trap for reliable cleanup
            cleanup() {
              echo "--- Cleaning up ephemeral workspace: ${REPO_DIR} ---"
              if [ -d "${REPO_DIR}" ]; then
                rm -rf "${REPO_DIR}"
                echo "--- Workspace cleaned successfully. ---"
              fi
            }
            trap cleanup EXIT

            # 3. Create workspace and deploy code
            echo "--- Creating ephemeral workspace: ${REPO_DIR} ---"
            git clone https://github.com/${{ github.repository }}.git "${REPO_DIR}"
            cd "${REPO_DIR}"
            git checkout "${PR_SHA}"

            # 4. Source environment and build
            echo "--- Sourcing Project Environment & Building ---"
            set +u
            source ~mocen/hailing.env
            set -u
            cd simulation
            cmake .
            make -j8
            cd .. # Return to repo root

            # 5. Conditional Execution Logic
            if [ "$SIM_SIZE" = "small" ]; then
              # --- SMALL RUN (Synchronous) ---
              echo "--- Running Simulation (small) ---"
              ./simulation/SLabSimu

              # Determine the output filename from the config
              OUTPUT_FILE=$(grep -A 1 "filename:" simulation/config/config.yaml | grep -v "filename:" | xargs)
              if [ -z "$OUTPUT_FILE" ]; then
                  OUTPUT_FILE="output.root"  # default fallback
              fi

              echo "--- Analyzing and Reporting Back (small) ---"
              # Use the new standard validation script for consistency
              python analysis/scripts/standard_validation.py \
                --input-file "$OUTPUT_FILE" \
                --output-dir "results"
              
              python analysis/scripts/post_process.py \
                --manifest "results/results_manifest.json" \
                --github-token "${{ secrets.GITHUB_TOKEN }}" \
                --repo "${{ github.repository }}" \
                --pr-number "${{ github.event.issue.number }}" \
                --commit-sha "$PR_SHA"

            else
              # --- LARGE RUN (Asynchronous via HTCondor) ---
              echo "--- Creating HTCondor submission ---"
              mkdir -p "${REPO_DIR}/logs"
              
              # HTCondor submission file
              printf '%s\n' \
                  "Universe   = vanilla" \
                  "Executable = ${REPO_DIR}/analysis/scripts/htcondor_run.sh" \
                  "Arguments  = \"${{ secrets.GITHUB_TOKEN }} ${{ github.repository }} ${{ github.event.issue.number }} $PR_SHA \$(ClusterId)\"" \
                  "Log        = ${REPO_DIR}/logs/job_\$(ClusterId).log" \
                  "Output     = ${REPO_DIR}/logs/job_\$(ClusterId).out" \
                  "Error      = ${REPO_DIR}/logs/job_\$(ClusterId).err" \
                  "request_cpus = 8" \
                  "should_transfer_files = NO" \
                  "queue" > job.sub
              
              JOB_ID=$(condor_submit job.sub | grep -oP 'submitted to cluster \K\d+')
              echo "--- Submitted job to HTCondor with ID: ${JOB_ID} ---"
            fi

      - name: Fail job if remote failed
        if: ${{ steps.remote_run.outcome != 'success' }}
        run: exit 1
