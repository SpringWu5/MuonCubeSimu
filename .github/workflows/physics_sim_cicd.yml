name: Physics Simulation CI/CD

on:
  issue_comment:
    types: [created]

jobs:
  trigger_simulation:
    if: |
      github.event.issue.pull_request &&
      (
        contains(github.event.comment.body, '@bot /run-simulation small') ||
        contains(github.event.comment.body, '@bot /run-simulation large')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Extract Simulation Size
        id: get_size
        run: |
          if [[ "${{ github.event.comment.body }}" == *"small"* ]]; then
            echo "size=small" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.comment.body }}" == *"large"* ]]; then
            echo "size=large" >> $GITHUB_OUTPUT
          fi

      - name: Post Acknowledgement Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const size = "${{ steps.get_size.outputs.size }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Received command to run **${size}** simulation. Connecting to INPAC cluster and deploying code...`,
            });

      - name: Deploy and Run Simulation on INPAC
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.INPAC_HOST }}
          username: ${{ secrets.INPAC_USERNAME }}
          key: ${{ secrets.INPAC_SSH_PRIVATE_KEY }}
          port: ${{ secrets.INPAC_PORT }}
          script: |
            set -e # Exit immediately if a command exits with a non-zero status.
            export REPO_DIR="/lustre/neutrino/wujiacheng/hephaestus-ci/MuonSLab/MuonCubeSimu/${{ github.event.issue.number }}"
            export PR_SHA=${{ github.event.issue.pull_request.head.sha }}
            export SIM_SIZE=${{ steps.get_size.outputs.size }}
            
            echo "--- Deploying code to ${REPO_DIR} ---"
            if [ -d "$REPO_DIR" ]; then
              cd $REPO_DIR
              git fetch origin
              git reset --hard $PR_SHA
            else
              git clone https://github.com/${{ github.repository }}.git $REPO_DIR
              cd $REPO_DIR
              git checkout $PR_SHA
            fi
            
            echo "--- Sourcing Project Environment ---"
            # --- CRITICAL: Source the project-specific environment ---
            source ~mocen/hailing.env
            
            echo "--- Building Simulation ---"
            # Assuming the repo is cloned at the top level, cd into simulation subdir
            cd simulation
            cmake .
            make -j8
            
            echo "--- Running Simulation (${SIM_SIZE}) ---"
            if [ "$SIM_SIZE" == "small" ]; then
              # Use a dedicated, non-visual macro for the small run
              ./SLabSimu -m small_run.mac
              
              echo "--- Running Post-Processing for small job ---"
              # The post_process script is in the analysis/scripts directory
              python ../analysis/scripts/post_process.py --job-id "small_run_${{ github.event.issue.number }}" --status "success" --pr-number "${{ github.event.issue.number }}" --repo-owner "${{ github.repository_owner }}" --repo-name "$(echo '${{ github.repository }}' | cut -d'/' -f2)" --token "${{ secrets.GITHUB_TOKEN }}"

            elif [ "$SIM_SIZE" == "large" ]; then
              echo "--- Creating HTCondor submission file ---"
              # Go back to the repo root to create the submission file
              cd ..
              cat << EOF > job.sub
              Universe   = vanilla
              Executable = ${REPO_DIR}/simulation/SLabSimu
              Arguments  = -m run.mac

              Log        = ${REPO_DIR}/logs/job_\$(ClusterId).log
              Output     = ${REPO_DIR}/logs/job_\$(ClusterId).out
              Error      = ${REPO_DIR}/logs/job_\$(ClusterId).err

              request_cpus = 8
              
              should_transfer_files = NO

              +PostCmd = "${REPO_DIR}/analysis/scripts/post_process.py"
              +PostArguments = "--job-id \$(ClusterId) --status success --pr-number ${{ github.event.issue.number }} --repo-owner ${{ github.repository_owner }} --repo-name $(echo '${{ github.repository }}' | cut -d'/' -f2) --token ${{ secrets.GITHUB_TOKEN }}"

              Queue
              EOF
              
              mkdir -p ${REPO_DIR}/logs
              JOB_ID=$(condor_submit job.sub | grep -oP 'submitted to cluster \K\d+')
              echo "--- Submitted job to HTCondor with ID: ${JOB_ID} ---"
              
              gh pr comment ${{ github.event.issue.number }} --body "🚀 **Large** simulation submitted to HTCondor cluster. Job ID: \`${JOB_ID}\`"
            fi