name: AI Pull Request Reviewer

permissions:
  contents: read

on:
  pull_request:
    branches:
      - develop

jobs:
  build_and_static_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup C++ Environment
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-11
          
      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v1.14
        with:
          cmake-version: '3.22.x'

      - name: Run CMake
        run: cmake ./simulation
        continue-on-error: true

      - name: Build Project (Smoke Test)
        run: make -C ./simulation
        # Expect link failures without Geant4; compilation must still succeed.
        continue-on-error: true
