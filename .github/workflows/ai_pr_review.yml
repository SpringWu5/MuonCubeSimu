name: AI Pull Request Reviewer

on:
  pull_request:
    branches:
      - develop

jobs:
  ai_code_reviewer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetches all history for git diff

      - name: Get PR Diff
        id: pr_diff
        run: |
          git fetch origin develop --depth=1
          DIFF=$(git diff origin/develop ${{ github.event.pull_request.head.sha }})
          # Escape for JSON and limit size if necessary (Copilot context max ~128K tokens)
          # Note: This truncation is basic and could be improved.
          DIFF=$(echo "$DIFF" | jq -s -R . | head -c 100000)
          echo "diff=${DIFF}" >> $GITHUB_OUTPUT

      - name: AI Code Review with Copilot Agent
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const diff = ${{ steps.pr_diff.outputs.diff }};
            const prNumber = context.issue.number;
            const customInstructionsPath = ".github/copilot/custom_instructions.md";
            let instructions = "Default review instructions: Check for clarity, correctness, and adherence to project standards.";
            try {
              const customInstructionsResponse = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: customInstructionsPath,
              });
              instructions = Buffer.from(customInstructionsResponse.data.content, 'base64').toString('utf8');
            } catch (error) {
              console.log(`Could not load custom instructions from ${customInstructionsPath}. Using default. Error: ${error.message}`);
            }

            // Create a temporary issue to task the Copilot Agent
            const issueResponse = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[AUTO] Copilot Review for PR #${prNumber}`,
              body: `
            **Copilot Coding Agent Task**

            Review this PR diff based on the charter below. Generate structured suggestions.

            **Review Charter:**
            ${instructions}

            **Code Diff:**
            \`\`\`diff
            ${diff}
            \`\`\`

            Output: Detailed review with 'suggestion' blocks for fixes.
              `,
              labels: ['copilot-review', 'automated'],
            });

            const tempIssueNumber = issueResponse.data.number;

            // Assign to Copilot Agent to trigger the review
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: tempIssueNumber,
              assignees: ['copilot'],
            });

            // --- Robust Polling Mechanism ---
            let agentReview = 'Agent review timed out after 5 minutes.';
            const startTime = Date.now();
            const timeout = 300000; // 5 minutes
            const pollInterval = 20000; // 20 seconds

            while (Date.now() - startTime < timeout) {
              console.log(`Polling for Copilot's review on issue #${tempIssueNumber}...`);
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tempIssueNumber,
              });
              
              const copilotComment = comments.data.find(c => c.user.login === 'copilot');
              
              if (copilotComment) {
                console.log("Found Copilot's review comment.");
                agentReview = copilotComment.body;
                break;
              }
              
              await new Promise(resolve => setTimeout(resolve, pollInterval));
            }

            // Post the retrieved review to the original PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `
            ### 🤖 Copilot Coding Agent Review

            ${agentReview}

            This was auto-generated by the Hephaestus Protocol QA Loop.
              `,
            });

            // Clean up the temporary issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: tempIssueNumber,
              state: 'closed',
            });

  build_and_static_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup C++ Environment
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-11
          
      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v1.14
        with:
          cmake-version: '3.22.x'

      - name: Run CMake
        run: cmake ./simulation
        continue-on-error: true

      - name: Build Project (Smoke Test)
        run: make -C ./simulation
        # This is a smoke test. We expect it to fail on linking due to missing Geant4,
        # but it should pass compilation, catching syntax errors.
        continue-on-error: true